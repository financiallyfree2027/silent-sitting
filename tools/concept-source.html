<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vipassana Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Caveat:wght@500;700&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: tab bar + example switcher, one 16:9 stage, caption + controls below. Light theme by choice. */
:root{
  color-scheme: light;
  --paper:#F4F6F9; --card:#FFFFFF; --ink:#1F2D4D; --muted:#6B7891; --line:#D6DDE7;
  --calm:#2A9D8F; --hot:#E0524A; --glow:#F0A93B;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;gap:10px}
.wrap{width:min(100%,calc((100vh - 150px)*16/9));display:flex;flex-direction:column;gap:8px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);padding-bottom:6px}
:fullscreen body,body:fullscreen{padding-block:8px}
.tabs{display:flex;gap:6px}
.tab{font:700 15px/1 var(--f-body);color:var(--muted);background:none;border:0;padding:10px 14px 12px;position:relative;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-7.5px;height:3px;border-radius:3px;background:var(--calm)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.sub{font:600 14px/1 var(--f-body);color:var(--muted);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
.sub[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.sub b{font-weight:800;margin-right:6px}
.tab:focus-visible,.sub:focus-visible,.ctrl:focus-visible,.dot:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.stage{width:100%;aspect-ratio:16/9;background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;position:relative}
.stage svg[hidden]{display:none!important}
.stage svg{display:block;width:100%;height:100%;position:absolute;inset:0}
.stage.scroll{overflow-y:auto;overscroll-behavior:contain}
.stage.scroll #svg-tt{position:relative;height:auto}
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.cap{flex:1 1 320px;min-width:0}
.kicker{font:800 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--calm);display:flex;gap:10px}
.kicker .n{color:var(--muted);font-variant-numeric:tabular-nums}
.text{font:500 clamp(15px,1.5vw,20px)/1.4 var(--f-body);margin-top:6px;text-wrap:balance}
.ctrls{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:5px;flex-wrap:wrap;max-width:240px}
.dot{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dot.done{background:var(--muted)} .dot.on{background:var(--ink)}
.ctrl{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ctrl.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ctrl:disabled{opacity:.35;cursor:default}
/* svg text */
.t-label{font:800 15px var(--f-body);letter-spacing:.16em;fill:var(--muted)}
.t-title{font:700 27px var(--f-display);fill:var(--ink)}
.t-small{font:500 17px var(--f-body);fill:var(--muted)}
.t-body{font:600 18px var(--f-body);fill:var(--ink)}
.t-hand{font-family:var(--f-hand);font-weight:700;fill:var(--ink)}
.t-big{font:800 46px var(--f-display);fill:var(--ink);font-variant-numeric:tabular-nums}
.bx{fill:#fff;stroke:var(--ink);stroke-width:2.5}
#svg-vp *{pointer-events:none}
#svg-vp .vp-seg{pointer-events:auto}
</style>

<div class="wrap">
  <div class="head">
    <nav class="tabs" role="tablist" aria-label="Sections"><button class="tab" role="tab" data-tab="concept" aria-selected="true">Concept</button><button class="tab" role="tab" data-tab="vp" aria-selected="false">Vipassana</button><button class="tab" role="tab" data-tab="hi" aria-selected="false">History</button><button class="tab" role="tab" data-tab="gu" aria-selected="false">Gurus</button><button class="tab" role="tab" data-tab="tt" aria-selected="false">Timetable</button><button class="tab" role="tab" data-tab="fe" aria-selected="false">Fees &amp; centres</button></nav>
    <div class="subtabs" role="tablist" aria-label="Examples">
      <button class="sub" role="tab" data-deck="e1" aria-selected="true"><b>Example 1</b>A harsh word</button>
      <button class="sub" role="tab" data-deck="e2" aria-selected="false"><b>Example 2</b>15 likes</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <svg id="svg-e1" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Example 1: a harsh word"></svg>
    <svg id="svg-e2" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Example 2: fifteen likes"></svg>

    <svg id="svg-hi" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="History of Vipassana"></svg>
    <svg id="svg-gu" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lineage of teachers"></svg>
    <svg id="svg-tt" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Daily timetable"></svg>
    <svg id="svg-fe" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fees and centres"></svg>
  </div>
  <div class="bar">

      <div class="kicker"><span id="kick"></span><span class="n" id="num"></span></div>

    <div class="ctrls">
      <div class="dots" id="dots"></div>
      <button class="ctrl" id="fs" aria-label="Full screen" title="Full screen (F)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="ctrl" id="prev" aria-label="Previous step"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="ctrl primary" id="next" aria-label="Next step"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
const C={ink:"#1F2D4D",calm:"#2A9D8F",hot:"#E0524A",amb:"#F0A93B",muted:"#6B7891",
  skin:"#E8B48C",skinS:"#CC9269",hair:"#2A2633",blush:"#E98C7C",lip:"#8A3B3B",
  heroShirt:"#3E6FD8",heroShirtS:"#2F58B4",heroPants:"#2D3B5C",heroPantsS:"#222E49",shoes:"#3A2F2A",
  spkShirt:"#9A6BD0",spkShirtS:"#7C52B2",spkPants:"#59627A",spkPantsS:"#474F64",spkHair:"#4A3426",spkSkin:"#D9A27A",spkSkinS:"#BC855E",
  momSaree:"#D2467A",momSareeS:"#A93460",momBorder:"#F0A93B",momBlouse:"#7A2E5B",momSkin:"#DCA47F",momSkinS:"#C08861",momHair:"#3B3540"};
const HERO={skin:C.skin,skinS:C.skinS,hair:C.hair,shirt:C.heroShirt,shirtS:C.heroShirtS,pants:C.heroPants,pantsS:C.heroPantsS,shoes:C.shoes,hairStyle:"short"};

/* ================= drawing kit ================= */
function defs(p){return `<defs>
<radialGradient id="${p}-red"><stop offset="0" stop-color="#E0524A" stop-opacity=".9"/><stop offset=".55" stop-color="#E0524A" stop-opacity=".45"/><stop offset="1" stop-color="#E0524A" stop-opacity="0"/></radialGradient>
<radialGradient id="${p}-amb"><stop offset="0" stop-color="#F0A93B" stop-opacity=".95"/><stop offset="1" stop-color="#F0A93B" stop-opacity="0"/></radialGradient>
<radialGradient id="${p}-tealGlow"><stop offset="0" stop-color="#2A9D8F" stop-opacity=".35"/><stop offset="1" stop-color="#2A9D8F" stop-opacity="0"/></radialGradient>
<linearGradient id="${p}-meterGrad" x1="1150" x2="1510" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2A9D8F"/><stop offset=".5" stop-color="#F0A93B"/><stop offset="1" stop-color="#E0524A"/></linearGradient>
<linearGradient id="${p}-beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7FD8EC" stop-opacity=".85"/><stop offset="1" stop-color="#7FD8EC" stop-opacity=".08"/></linearGradient>
<linearGradient id="${p}-reelSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5EC6E3"/><stop offset="1" stop-color="#CFF3F3"/></linearGradient>
<linearGradient id="${p}-parkSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE0F5"/><stop offset="1" stop-color="#EEF6FB"/></linearGradient>
<clipPath id="${p}-dbClip"><rect x="152" y="66" width="136" height="72" rx="8"/></clipPath>
<clipPath id="${p}-scr"><rect x="812" y="258" width="226" height="454" rx="24"/></clipPath>
</defs>`}

function head(o,x,y){
  const hs=o.hairStyle||"short"; let back="",cap="",extra="";
  if(hs==="bun"){
    back=`<circle cx="${x+4}" cy="${y-52}" r="25" fill="${o.hair}"/>`;
    cap=`<path d="M${x-52},${y+8} Q${x-58},${y-60} ${x},${y-58} Q${x+58},${y-60} ${x+52},${y+8} Q${x+46},${y-30} ${x+2},${y-36} Q${x-44},${y-30} ${x-52},${y+8} Z" fill="${o.hair}"/>
      <path d="M${x+2},${y-57} L${x+2},${y-38}" stroke="#6E6774" stroke-width="2"/>
      <path d="M${x-42},${y-36} q12,-15 32,-17" stroke="#9A93A0" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    extra=`<circle cx="${x}" cy="${y-25}" r="3.8" fill="${C.hot}"/>`;
  } else if(hs==="side"){
    cap=`<path d="M${x-53},${y-2} Q${x-52},${y-66} ${x+8},${y-62} Q${x+62},${y-58} ${x+53},${y} Q${x+46},${y-34} ${x+10},${y-40} Q${x-28},${y-44} ${x-53},${y-2} Z" fill="${o.hair}"/>`;
    extra=o.noMustache?"":`<path d="M${x-15},${y+22} q15,-7 30,0" stroke="${o.hair}" stroke-width="5.5" stroke-linecap="round" fill="none"/>`;
  } else if(hs==="shaved"){
    cap=`<path d="M${x-49},${y-8} Q${x-46},${y-50} ${x},${y-50} Q${x+46},${y-50} ${x+49},${y-8} Q${x},${y-36} ${x-49},${y-8} Z" fill="${o.hair}" opacity=".18"/>`;
  } else if(hs==="curls"){
    back=`<ellipse cx="${x}" cy="${y-58}" rx="24" ry="18" fill="${o.hair}"/>`;
    cap=`<path d="M${x-52},${y-2} Q${x-56},${y-60} ${x},${y-60} Q${x+56},${y-60} ${x+52},${y-2} Q${x+30},${y-30} ${x},${y-32} Q${x-30},${y-30} ${x-52},${y-2} Z" fill="${o.hair}"/>`+
      [[-30,-40],[-14,-48],[2,-50],[18,-48],[34,-40],[-38,-24],[-22,-38],[-6,-40],[10,-40],[26,-38],[42,-24],[-6,-66],[8,-66],[-14,-58],[16,-58]].map(([a,b])=>`<circle cx="${x+a}" cy="${y+b}" r="4.2" fill="#3E5079"/>`).join("");
  } else if(hs==="wrap"){
    cap=`<path d="M${x-53},${y+4} Q${x-56},${y-30} ${x-46},${y-30} L${x+46},${y-30} Q${x+56},${y-30} ${x+53},${y+4} Q${x+48},${y-18} ${x},${y-20} Q${x-48},${y-18} ${x-53},${y+4} Z" fill="${o.hair}"/>
      <path d="M${x-54},${y-12} Q${x-56},${y-68} ${x},${y-68} Q${x+56},${y-68} ${x+54},${y-12} Q${x},${y-30} ${x-54},${y-12} Z" fill="${o.wrapColor}" stroke="#C9B9C2" stroke-width="2"/>
      <path d="M${x-44},${y-30} Q${x},${y-50} ${x+44},${y-30} M${x-40},${y-46} Q${x},${y-62} ${x+40},${y-46}" stroke="#D8C8D0" stroke-width="2" fill="none"/>
      <ellipse cx="${x+50}" cy="${y-44}" rx="17" ry="11" fill="${o.wrapColor}" stroke="#C9B9C2" stroke-width="2"/><path d="M${x+60},${y-50} q22,-14 34,-4" stroke="${o.wrapColor}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  } else {
    cap=`<path d="M${x-53},${y+2} Q${x-58},${y-62} ${x},${y-60} Q${x+58},${y-62} ${x+53},${y} Q${x+46},${y-28} ${x+22},${y-32} Q${x-4},${y-22} ${x-30},${y-33} Q${x-48},${y-26} ${x-53},${y+2} Z" fill="${o.hair}"/>`;
  }
  const open=o.eyes!=="closed";
  const glasses=o.glasses?`<rect x="${x-32}" y="${y-10}" width="25" height="18" rx="6" fill="#1F2433"/><rect x="${x+7}" y="${y-10}" width="25" height="18" rx="6" fill="#1F2433"/><path d="M${x-7},${y-3} h14" stroke="#1F2433" stroke-width="3"/>`:"";
  return `${back}
  <ellipse cx="${x-50}" cy="${y+(o.urna?10:2)}" rx="9" ry="${o.urna?22:13}" fill="${o.skinS}"/><ellipse cx="${x+50}" cy="${y+(o.urna?10:2)}" rx="9" ry="${o.urna?22:13}" fill="${o.skinS}"/>
  <circle cx="${x}" cy="${y}" r="50" fill="${o.skin}"/>
  ${cap}
  <circle cx="${x-30}" cy="${y+18}" r="8" fill="${C.blush}" opacity=".35"/><circle cx="${x+30}" cy="${y+18}" r="8" fill="${C.blush}" opacity=".35"/>
  <g class="eyes-open" opacity="${open?1:0}"><ellipse cx="${x-19}" cy="${y}" rx="4.6" ry="6.2" fill="${C.hair}"/><ellipse cx="${x+19}" cy="${y}" rx="4.6" ry="6.2" fill="${C.hair}"/><circle cx="${x-17.5}" cy="${y-2.5}" r="1.6" fill="#fff"/><circle cx="${x+20.5}" cy="${y-2.5}" r="1.6" fill="#fff"/></g>
  <g class="eyes-closed" opacity="${open?0:1}"><path d="M${x-26},${y} q7,6 14,0 M${x+12},${y} q7,6 14,0" fill="none" stroke="${C.hair}" stroke-width="3.5" stroke-linecap="round"/></g>
  ${glasses}
  <path class="brow-l" d="M${x-30},${y-17} q10,-6 20,0" fill="none" stroke="${o.hair}" stroke-width="4" stroke-linecap="round"/>
  <path class="brow-r" d="M${x+10},${y-17} q10,-6 20,0" fill="none" stroke="${o.hair}" stroke-width="4" stroke-linecap="round"/>
  <path d="M${x-1},${y+5} q-6,11 3,13" fill="none" stroke="${o.skinS}" stroke-width="3" stroke-linecap="round"/>
  <path class="m-calm" d="M${x-12},${y+30} q12,7 24,0" fill="none" stroke="${C.lip}" stroke-width="3.5" stroke-linecap="round"/>
  <path class="m-frown" d="M${x-12},${y+35} q12,-8 24,0" fill="none" stroke="${C.lip}" stroke-width="3.5" stroke-linecap="round" opacity="0"/>
  <ellipse class="m-talk" cx="${x}" cy="${y+32}" rx="8" ry="2" fill="${C.lip}" opacity="0"/>
  ${o.old?`<path d="M${x-18},${y-28} q18,-5 36,0 M${x-13},${y-36} q13,-4 26,0 M${x-36},${y+12} q4,8 0,16 M${x+36},${y+12} q-4,8 0,16" stroke="${o.skinS}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`:""}
  ${o.urna?`<circle cx="${x}" cy="${y-14}" r="3.2" fill="${o.skinS}"/>`:""}
  ${extra}${o.headExtra?o.headExtra(x,y):""}`;
}
const lim=(d,c,w)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const shoes=c=>`<path d="M-44,-14 L-8,-14 Q-4,-14 -4,-6 L-4,0 L-52,0 Q-52,-14 -44,-14 Z" fill="${c}"/><path d="M8,-14 L44,-14 Q52,-14 52,0 L4,0 L4,-6 Q4,-14 8,-14 Z" fill="${c}"/>`;
const shadow=(rx=76)=>`<ellipse cx="0" cy="2" rx="${rx}" ry="10" fill="#1F2D4D" opacity=".13"/>`;

function standing(o){
  const arm=s=>{
    if(o.gesture&&s===1) return lim("M50,-345 Q74,-318 86,-288",o.shirt,28)+lim("M86,-288 Q110,-298 124,-326",o.skin,19)+`<circle cx="127" cy="-331" r="12" fill="${o.skin}"/>`+(o.handItem||"");
    return lim(`M${50*s},-345 Q${70*s},-305 ${72*s},-262`,o.shirt,28)+lim(`M${72*s},-262 Q${74*s},-225 ${70*s},-196`,o.skin,19)+`<circle cx="${70*s}" cy="-188" r="12" fill="${o.skin}"/>`;
  };
  return `<g transform="translate(${o.cx},${o.base})"><g id="${o.p}">${shadow()}
  <path d="M-48,-160 L-4,-160 L-10,-12 L-40,-12 Z" fill="${o.pants}"/><path d="M4,-160 L48,-160 L40,-12 L10,-12 Z" fill="${o.pants}"/>
  <path d="M-4,-160 L4,-160 L3,-110 L-3,-110 Z" fill="${o.pantsS}"/>
  ${shoes(o.shoes)}
  <rect x="-13" y="-392" width="26" height="36" fill="${o.skinS}"/>
  <path d="M-58,-330 Q-56,-356 -30,-362 L30,-362 Q56,-356 58,-330 L52,-160 Q0,-152 -52,-160 Z" fill="${o.shirt}"/>
  <path d="M22,-362 L30,-362 Q56,-356 58,-330 L52,-160 Q38,-157 28,-156 Z" fill="${o.shirtS}" opacity=".55"/>
  <path d="M-17,-362 L0,-338 L17,-362 Z" fill="${o.skinS}"/>
  <path d="M-52,-170 L52,-170 L52,-158 L-52,-158 Z" fill="${o.pantsS}"/><rect x="-8" y="-170" width="16" height="12" rx="2" fill="#C9B07A"/>
  ${arm(-1)}${arm(1)}
  ${head(o,0,-430)}
  </g></g>`;
}
function mother(o){
  return `<g transform="translate(${o.cx},${o.base})"><g id="${o.p}">${shadow(84)}
  <path d="M-50,-250 Q-76,-100 -72,0 L72,0 Q76,-100 50,-250 Z" fill="${C.momSaree}"/>
  <path d="M-16,-240 L-24,-16 M8,-240 L10,-16 M28,-240 L40,-16" stroke="${C.momSareeS}" stroke-width="3" opacity=".7"/>
  <path d="M-73,-18 L73,-18 L72,0 L-72,0 Z" fill="${C.momBorder}"/>
  <path d="M-50,-266 L50,-266 L50,-244 L-50,-244 Z" fill="${o.skin}"/>
  <rect x="-13" y="-392" width="26" height="36" fill="${o.skinS}"/>
  <path d="M-54,-330 Q-52,-356 -28,-362 L28,-362 Q52,-356 54,-330 L50,-266 L-50,-266 Z" fill="${C.momBlouse}"/>
  <path d="M-17,-362 L0,-342 L17,-362 Z" fill="${o.skinS}"/>
  ${lim("M-50,-345 Q-62,-325 -66,-304",C.momBlouse,26)}${lim("M-66,-304 Q-74,-252 -66,-206",o.skin,18)}<circle cx="-65" cy="-198" r="11" fill="${o.skin}"/>
  <path d="M22,-366 L54,-350 L-30,-146 L-62,-176 Z" fill="${C.momSaree}"/>
  <path d="M54,-350 L-30,-146" stroke="${C.momBorder}" stroke-width="8"/>
  ${lim("M50,-345 Q64,-325 72,-306",C.momBlouse,26)}${lim("M72,-306 Q100,-300 120,-324",o.skin,18)}<circle cx="124" cy="-329" r="11" fill="${o.skin}"/>
  <path d="M108,-318 a14,6 -30 0 0 16,-12" stroke="${C.momBorder}" stroke-width="4" fill="none"/>
  ${head(o,0,-430)}
  </g></g>`;
}
function seatedSofa(o){
  const arm=s=>lim(`M${50*s},-316 Q${72*s},-272 ${64*s},-236`,o.shirt,26)+lim(`M${64*s},-236 Q${44*s},-214 ${16*s},-218`,o.skin,19);

const ZOOM_FULL={x:0,y:0,w:1600,h:900};
function makeCam(svg){const v={...ZOOM_FULL};const apply=()=>svg.setAttribute("viewBox",`${v.x} ${v.y} ${v.w} ${v.h}`);
  return {v,apply,set:b=>{Object.assign(v,b);apply();},to:(tl,b,d,pos)=>tl.to(v,{...b,duration:d,ease:"power3.inOut",onUpdate:apply},pos)};}
const mix=gsap.utils.interpolate(C.calm,C.hot);
function makeSlider(p){
  const S={v:0,spring:0},g=id=>document.getElementById(`${p}-${id}`);
  const knob=g("knob"),fill=g("fill"),val=g("val"),eq=g("eq"),spr=g("spring");
  const Y=585,X0=1150,W=360,A=1119;
  const sd=(x1,x2)=>{const n=14,a=12,L=x2-x1-8;let d=`M${x1},${Y} L${x1+4},${Y}`;for(let i=1;i<n;i++)d+=` L${(x1+4+L*i/n).toFixed(1)},${Y+(i%2?-a:a)}`;return d+` L${x2-4},${Y} L${x2},${Y}`;};
  S.render=()=>{const v=Math.max(0,Math.min(100,S.v)),cx=X0+v/100*W;knob.setAttribute("cx",cx);fill.setAttribute("width",Math.max(0,cx-X0));
    const c=mix(v/100);knob.setAttribute("stroke",c);val.setAttribute("fill",c);val.textContent=Math.round(v);eq.textContent=`Equanimity ${100-Math.round(v)}%`;
    spr.setAttribute("d",sd(A,cx-18));spr.setAttribute("opacity",S.spring);};
  return S;
}

  <g id="hi-title"><text x="800" y="130" text-anchor="middle" class="t-big" style="font-size:62px">How Vipassana was found</text><text x="800" y="178" text-anchor="middle" class="t-small" style="font-size:24px">A prince, one question, and 2,500 years</text></g>
  ${lab("hi-l1","KAPILAVASTU · ABOUT 2,500 YEARS AGO","Prince Siddhartha","Every comfort. Kept far from any suffering.")}
  ${lab("hi-l3","AGE 29","He leaves the palace","to find a way out of suffering")}
  ${lab("hi-l4a","6 YEARS","Extreme fasting","He nearly starved. It didn't work.")}
  ${lab("hi-l4b","THE MIDDLE PATH","Neither luxury nor torture","He starts again, gently, with the breath.")}
  ${lab("hi-l5","AGE 35 · BODH GAYA","He becomes the Buddha","“the awakened one”")}
  ${lab("hi-l6","DEER PARK, SARNATH","The first teaching","Then 45 years of teaching, to anyone")}
  <g id="hi-tl"><line x1="140" y1="470" x2="480" y2="470" stroke="${C.amb}" stroke-width="8" stroke-linecap="round"/>
    <line x1="480" y1="470" x2="790" y2="470" stroke="#B8C0CC" stroke-width="8" stroke-dasharray="4 14" stroke-linecap="round"/>
    <line x1="790" y1="470" x2="1460" y2="470" stroke="${C.calm}" stroke-width="8" stroke-linecap="round"/>
    ${tl.map(([x,a,b,c,d],i)=>`<g class="hi-node"><circle cx="${x}" cy="470" r="18" fill="#fff" stroke="${i==1?"#8A93A3":i==0?C.amb:C.calm}" stroke-width="6"/>

      <text x="${x}" y="${d<0?392:592}" text-anchor="middle" class="t-body" style="font-size:20px">${b}</text><text x="${x}" y="${d<0?420:620}" text-anchor="middle" class="t-body" style="font-size:20px">${c}</text></g>`).join("")}
    <circle id="hi-dot" cx="140" cy="470" r="12" fill="${C.ink}"/></g>
  <g id="hi-end"><text x="800" y="150" text-anchor="middle" class="t-big" style="font-size:52px">Passed on, teacher to student, for 2,500 years</text>

  const HIDE=["#hi-stars","#hi-forest","#hi-bodhi","#hi-halo","#hi-asc","#hi-buddha","#hi-sparks","#hi-disc","#hi-anicca","#hi-sights","#hi-l1","#hi-l3","#hi-l4a","#hi-l4b","#hi-l5","#hi-l6","#hi-tl","#hi-end"];

    gsap.set(svg.querySelectorAll(".hi-win"),{attr:{fill:"#8FB7D9"}});gsap.set("#hi-bodhi",{scale:.3,transformOrigin:"50% 100%"});
    gsap.set([1,2,3,4].map(i=>`#hi-card${i}`),{opacity:0,y:30});gsap.set(svg.querySelectorAll(".hi-node"),{opacity:0});gsap.set("#hi-dot",{attr:{cx:140}});
    gsap.set(svg.querySelectorAll("#hi-disc > g"),{opacity:0});gsap.set(svg.querySelectorAll(".spark"),{opacity:0});}
  const steps=[
    {k:"History",c:"Before the technique, there was a person and a question: why do we suffer, and can it end?",b:()=>{}},
    {k:"The prince",c:"About 2,500 years ago, in Kapilavastu, Prince Siddhartha Gautama grew up with every comfort. His father kept all suffering out of his sight.",b:tl=>{
      tl.to("#hi-title",{opacity:0,duration:.5},0).to("#hi-l1",{opacity:1,duration:.6},.4).to("#hi-prince",{y:-6,duration:.25,yoyo:true,repeat:3},.6);}},
    {k:"Four sights",c:"Outside the palace he saw four things: an old man, a sick man, a dead body, and a calm monk. Everyone ages, falls ill and dies. Is there a way out?",b:tl=>{
      tl.to("#hi-l1",{opacity:0,duration:.4},0).to("#hi-sights",{opacity:1,duration:.1},.2);
      [1,2,3,4].forEach(i=>tl.to(`#hi-card${i}`,{opacity:1,y:0,duration:.6,ease:"back.out(1.6)"},.3+i*.55));mood(tl,"#hi-prince","upset",1.2);}},
    {k:"Leaving",c:"At 29 he left the palace at night, giving up his kingdom to search for the end of suffering.",b:tl=>{
      tl.to("#hi-sights",{opacity:0,duration:.5},0).to("#hi-sky",{attr:{fill:"#1C2640"},duration:1.4},.3).to("#hi-ground",{attr:{fill:"#2E4A3A"},duration:1.4},.3)
        .to("#hi-stars",{opacity:1,duration:1},.9).to(svg.querySelectorAll(".hi-win"),{attr:{fill:"#FFD27A"},duration:1},.6).to("#hi-l3",{opacity:1,duration:.6},1)
        .to("#hi-prince",{x:-760,duration:2.6,ease:"power1.in"},1.6).to("#hi-prince",{y:-6,duration:.2,yoyo:true,repeat:11},1.6);}},
    {k:"Six years",c:"For six years he tried extreme fasting and hardship. It nearly killed him, and it didn't work. So he chose the middle path.",b:tl=>{
      tl.to(["#hi-l3","#hi-palace","#hi-stars"],{opacity:0,duration:.6},0).to("#hi-sky",{attr:{fill:"#F4DEC3"},duration:1.2},.3).to("#hi-ground",{attr:{fill:"#D8C79C"},duration:1.2},.3)
        .to("#hi-forest",{opacity:1,duration:.8},.6).to("#hi-asc",{opacity:1,duration:.8},.9).to("#hi-l4a",{opacity:1,duration:.6},1.2)
        .to("#hi-l4a",{opacity:0,duration:.5},4).to("#hi-l4b",{opacity:1,duration:.6},4.4);}},
    {k:"Bodh Gaya",c:"At 35, sitting under the Bodhi tree, he observed his breath and then every sensation in the body. Each one arose and passed away. Watching without reacting, he was freed. This is Vipassana.",b:tl=>{
      tl.to(["#hi-l4b","#hi-forest"],{opacity:0,duration:.5},0).to("#hi-sky",{attr:{fill:"#DDEBF6"},duration:1.2},.2).to("#hi-ground",{attr:{fill:"#CBE3B9"},duration:1.2},.2)
        .to("#hi-bodhi",{opacity:1,scale:1,duration:1.6,ease:"power2.out"},.4).to("#hi-asc",{opacity:0,duration:.8},1.4).to("#hi-buddha",{opacity:1,duration:.8},1.4)
        .to("#hi-halo",{opacity:.35,duration:1},2).to("#hi-l5",{opacity:1,duration:.6},2.2).to("#hi-sparks",{opacity:1,duration:.1},2.6).to("#hi-anicca",{opacity:1,duration:.8},3);},
      amb:()=>gsap.utils.toArray("#svg-hi .spark").map((s,i)=>gsap.fromTo(s,{opacity:0,scale:.3,transformOrigin:"50% 50%"},{opacity:1,scale:1,duration:.6,yoyo:true,repeat:-1,repeatDelay:1.4,delay:(i*.37)%2.6}))},
    {k:"Sarnath",c:"His first teaching was at the Deer Park in Sarnath, to five companions. He then taught for 45 years, to anyone who came.",b:tl=>{
      tl.to(["#hi-l5","#hi-anicca","#hi-sparks"],{opacity:0,duration:.5},0).to("#hi-disc",{opacity:1,duration:.1},.3)
        .to(svg.querySelectorAll("#hi-disc > g"),{opacity:1,duration:.6,stagger:.3},.4).to("#hi-l6",{opacity:1,duration:.6},.6);}},
    {k:"Lost and kept",c:"About 500 years later the practice was lost in India. In Burma (Myanmar) a chain of teachers kept it alive, teacher to student, until it returned to India in 1969.",b:tl=>{
      tl.to(["#hi-l6","#hi-disc","#hi-buddha","#hi-bodhi","#hi-halo","#hi-ground"],{opacity:0,duration:.7},0).to("#hi-tl",{opacity:1,duration:.4},.6)
        .to(svg.querySelectorAll(".hi-node"),{opacity:1,duration:.5,stagger:.9},.8).to("#hi-dot",{attr:{cx:1460},duration:4.4,ease:"none"},.8);}},
    {k:"History",c:"The same technique you practise on Day 4 is the one found under the Bodhi tree, passed on hand to hand for 2,500 years.",b:tl=>{tl.to("#hi-end",{opacity:1,duration:.8},0);}}
  ];
  return {svg,steps,init};
})();

    <g id="vp-bal"><rect x="735" y="280" width="250" height="78" rx="20" fill="${TEA}"/><text x="860" y="312" text-anchor="middle" style="font:800 21px Figtree,sans-serif;fill:#fff">sharp pain → back to 0</text><text x="860" y="342" text-anchor="middle" style="font:700 18px Figtree,sans-serif;fill:#fff;opacity:.9">balanced</text></g>
    <g transform="translate(1010,590) scale(.935) translate(-1100,-470)">${meter(p)}</g>
  </g>
  ${metta}`;

  /* --- custom spring strength --- */
  const S=makeSlider(p);S.n=8;S.sw=2.5;S.amp=8;
  {const g=id=>document.getElementById(`${p}-${id}`);const knob=g("knob"),fill=g("fill"),val=g("val"),eq=g("eq"),spr=g("spring"),bs=document.getElementById("vp-bigspring");const Y=585,X0=1150,W=360,A=1119;
   S.render=()=>{const v=Math.max(0,Math.min(100,S.v)),cx=X0+v/100*W;knob.setAttribute("cx",cx);fill.setAttribute("width",Math.max(0,cx-X0));
    const c=mix(v/100);knob.setAttribute("stroke",c);val.setAttribute("fill",c);val.textContent=Math.round(v);eq.textContent=`Equanimity ${100-Math.round(v)}%`;
    const n=Math.round(S.n),a=S.amp,x1=A,x2=cx-18,L=x2-x1-8;let d=`M${x1},${Y} L${x1+4},${Y}`;for(let i=1;i<n;i++)d+=` L${(x1+4+L*i/n).toFixed(1)},${Y+(i%2?-a:a)}`;
    spr.setAttribute("d",d+` L${x2-4},${Y} L${x2},${Y}`);spr.setAttribute("opacity",S.spring);spr.setAttribute("stroke-width",S.sw);
    {const b1=752,b2=966,yy=511,aa=a*1.9,LL=b2-b1;let dd=`M${b1},${yy}`;for(let i=1;i<n;i++)dd+=` L${(b1+LL*i/n).toFixed(1)},${yy+(i%2?-aa:aa)}`;bs.setAttribute("d",dd+` L${b2},${yy}`);bs.setAttribute("stroke-width",S.sw*1.25);}};}
  const springTxt=document.getElementById("vp-springTag");

  /* --- card helpers --- */
  const ttl1=document.getElementById("vp-ttl1"),ttl2=document.getElementById("vp-ttl2");
  const SUBT={A:"awareness of breath",V:"body scan, part by part",M:"loving-kindness"};
  const openCard=(tl,k,t=0)=>{const s=SEG[k];
    tl.set("#vp-card",{attr:{x:BX,y:s.y,width:BW,height:s.h,fill:s.c,stroke:s.c},opacity:1},t)
      .set(`#vp-seg${k}`,{opacity:0},t)
      .to(["#vp-ov",".vp-seg",`#vp-tickA`,"#vp-tickV","#vp-tickM"],{opacity:0,duration:.4},t)
      .to("#vp-card",{attr:{x:CARD.x,y:CARD.y,width:CARD.w,height:CARD.h,fill:s.t},duration:1.1,ease:"power3.inOut"},t+.2)
      .call(()=>{ttl1.textContent=s.name;ttl1.style.fill=s.c;ttl2.textContent=SUBT[k];},null,t+.9)
      .to("#vp-ttl",{opacity:1,duration:.5},t+1);};
  const DONE={A:["A"],V:["A","V"],M:["A","V","M"]};
  const closeCard=(tl,k,scene,t=0)=>{const s=SEG[k];
    tl.to([scene,"#vp-ttl"],{opacity:0,duration:.5},t)
      .to("#vp-card",{attr:{x:BX,y:s.y,width:BW,height:s.h,fill:s.c},duration:1,ease:"power3.inOut"},t+.4)
      .set(".vp-seg",{opacity:1},t+1.4).set("#vp-card",{opacity:0},t+1.4)
      .to(["#vp-ov"],{opacity:1,duration:.6},t+1.4).to(DONE[k].map(x=>`#vp-tick${x}`),{opacity:1,scale:1,duration:.6,ease:"back.out(2)"},t+1.6);};
  const pulseSeg=k=>[gsap.to(`#vp-seg${k}`,{opacity:.55,duration:.7,yoyo:true,repeat:-1,ease:"sine.inOut"})];

  /* --- scan helper --- */
  const scan=(tl,i,t,d,round)=>{const show=round===1||PARTS[i][4]!=="—";
    tl.to(`#vp-hl${i}`,{opacity:1,duration:.2},t);
    if(show){tl.fromTo(`#vp-bu${i}`,{opacity:0},{opacity:1,duration:.2},t+.1).fromTo(`#vp-bu${i} .vp-dot`,{scale:0,transformOrigin:"50% 50%"},{scale:1.3,duration:.4,ease:"back.out(3)"},t+.1)
      .to(`#vp-bu${i}`,{opacity:0,duration:.35},t+d*.75);}
    tl.to(round===1?`#vp-l1_${i}`:`#vp-l2_${i}`,{opacity:1,duration:.3},t+.2).to(`#vp-hl${i}`,{opacity:0,duration:.2},t+d);
    if(round===2&&!show)tl.to(`#vp-st${i}`,{scaleX:1,duration:.3},t+.25);};

  const ALLH=["#vp-card","#vp-ttl","#vp-A","#vp-V","#vp-M","#vp-tickA","#vp-tickV","#vp-tickM","#vp-sum","#vp-inset","#vp-eleScene","#vp-path","#vp-pf","#vp-tb","#vp-eleLab","#vp-chipR","#vp-chipG","#vp-reins",
    "#vp-anicca","#vp-plus","#vp-bal","#vp-sprP","#vp-bigburst","#vp-r2h","#vp-bub",".vp-ring","#vp-emit","#vp-mglow","#vp-meter"];
  function init(){
    resetFaces(svg);gsap.set(ALLH,{opacity:0});gsap.set(["#vp-ov",".vp-seg","#vp-breathe","#vp-ele"],{opacity:1});
    gsap.set(["#vp-tickA","#vp-tickV","#vp-tickM"],{scale:.3,transformOrigin:"50% 50%"});
    gsap.set("#vp-ele",{x:0});gsap.set(svg.querySelectorAll(".vp-skin"),{attr:{fill:(i,el)=>el.dataset.f}});gsap.set("#vp-trunk",{attr:{stroke:SK}});gsap.set("#vp-rider",{rotation:0,y:0,svgOrigin:"770 420"});
    gsap.set(svg.querySelectorAll(".vp-leg"),{rotation:0});gsap.set("#vp-medAs",{scaleY:1,transformOrigin:"50% 100%"});
    gsap.set([...PARTS.map((_,i)=>`#vp-hl${i}`),...PARTS.map((_,i)=>`#vp-bu${i}`),...PARTS.map((_,i)=>`#vp-l1_${i}`),...PARTS.map((_,i)=>`#vp-l2_${i}`)],{opacity:0});
    gsap.set(PARTS.map((_,i)=>`#vp-st${i}`),{scaleX:0,transformOrigin:"0% 50%"});
    gsap.set(svg.querySelectorAll(".vp-tb"),{opacity:0,scale:.7,transformOrigin:"50% 50%"});gsap.set(".vp-ring",{opacity:0});
    S.v=0;S.spring=0;S.n=8;S.sw=2.5;S.amp=8;S.render();springTxt.textContent="the spring = equanimity";
    gsap.set("#vp-springTag",{opacity:0});gsap.set("#vp-card",{attr:{x:0,y:0,width:0,height:0}});
    gsap.set(svg.querySelectorAll(".vp-airdot"),{opacity:0});
  }
  // segment clicks jump to sections
  svg.querySelectorAll(".vp-seg").forEach(r=>r.addEventListener("click",e=>{const n={A:1,V:7,M:16}[r.dataset.k];if(window.__go&&+getComputedStyle(r).opacity>.5){e.stopPropagation();window.__go(n);}}));

  const steps=[
    {k:"Vipassana",c:"A 10-day course teaches three techniques, one after another. Roughly a third is Anapana, most is Vipassana, and a little is Metta.",b:()=>{}},
    {k:"Anapana",c:"Anapana means awareness of breath. For the first three and a half days, you only watch your natural breath.",b:tl=>openCard(tl,"A")},
    {k:"Anapana · the breath",c:"Attention rests on the small area below the nostrils, above the upper lip. Breath comes in, breath goes out. You just notice it.",b:tl=>{
      tl.to("#vp-A",{opacity:1,duration:.1},0).set("#vp-eleScene",{opacity:0},0).fromTo("#vp-breathe",{opacity:0},{opacity:1,duration:.6},0).to("#vp-inset",{opacity:1,duration:.6},.5);},
      amb:()=>{const dots=svg.querySelectorAll(".vp-airdot");let n=1;const cnt=document.getElementById("vp-cnt");
        const a=gsap.timeline({repeat:-1});
        a.call(()=>{cnt.textContent=`breathing in · ${n}`;}).to("#vp-medAs",{scaleY:1.035,duration:2,ease:"sine.inOut"},0)
         .fromTo(dots,{attr:{cx:930,cy:450},opacity:0},{attr:{cx:1095,cy:462},opacity:1,duration:1.6,stagger:.12,ease:"power1.in"},0).to(dots,{opacity:0,duration:.2},1.85)
         .call(()=>{cnt.textContent=`breathing out · ${n}`;},null,2).to("#vp-medAs",{scaleY:1,duration:2,ease:"sine.inOut"},2)
         .fromTo(dots,{attr:{cx:1095,cy:466},opacity:1},{attr:{cx:930,cy:520},opacity:0,duration:1.7,stagger:.12,ease:"power1.out"},2.05)
         .call(()=>{n=n%10+1;},null,4);return [a];}},
    {k:"The mind is an elephant",c:"Think of the mind as a huge, strong elephant, and yourself as the small rider on top.",b:tl=>{
      tl.to("#vp-breathe",{opacity:0,duration:.5},0).to("#vp-eleScene",{opacity:1,duration:.7},.4).to("#vp-eleLab",{opacity:1,duration:.6},1);},
      amb:()=>[gsap.to("#vp-ear",{rotation:5,svgOrigin:"960 420",duration:1.6,yoyo:true,repeat:-1,ease:"sine.inOut"}),gsap.to("#vp-trunk",{rotation:3,svgOrigin:"1085 520",duration:2,yoyo:true,repeat:-1,ease:"sine.inOut"})]},
    {k:"Untrained mind",c:"Untrained, the mind keeps running to the past and the future, and drags you along. The mind controls you.",b:tl=>{
      tl.to("#vp-eleLab",{opacity:0,duration:.4},0).to("#vp-pf",{opacity:1,duration:.5},.2).to("#vp-chipR",{opacity:1,duration:.5},.4)
        .set("#vp-tb",{opacity:1},.5).to(svg.querySelectorAll(".vp-tb"),{opacity:1,scale:1,duration:.5,stagger:.25,ease:"back.out(2)"},.5);mood(tl,"#vp-rider","upset",.4);},
      amb:()=>{const a=gsap.timeline({repeat:-1});const skins=svg.querySelectorAll(".vp-skin");
        a.to("#vp-ele",{x:-220,duration:.9,ease:"power2.inOut"}).to(skins,{attr:{fill:(i,el)=>el.dataset.r},opacity:.85,duration:.5},"<").to("#vp-trunk",{attr:{stroke:"#D9786F"},duration:.5},"<")
         .to(".vp-tbL",{scale:1.12,duration:.3,yoyo:true,repeat:1},"<.4")
         .to("#vp-ele",{x:220,duration:1.1,ease:"power2.inOut"}).to(skins,{attr:{fill:(i,el)=>el.dataset.r},opacity:1,duration:.5},"<").to("#vp-trunk",{attr:{stroke:"#E0524A"},duration:.5},"<")
         .to(".vp-tbR",{scale:1.12,duration:.3,yoyo:true,repeat:1},"<.5").to("#vp-ele",{x:0,duration:.8,ease:"power2.inOut"});
        return [a,gsap.to("#vp-rider",{rotation:13,y:-10,duration:.13,yoyo:true,repeat:-1,ease:"sine.inOut"}),gsap.to(svg.querySelectorAll(".vp-leg"),{rotation:8,transformOrigin:"50% 0%",duration:.2,yoyo:true,repeat:-1,stagger:.1})];}},
    {k:"Trained with Anapana",c:"Each time the mind runs off, you gently bring it back to the breath. Slowly it settles, and you guide the mind.",b:tl=>{
      tl.to("#vp-ele",{x:0,duration:.8,ease:"power2.out"},0).to(svg.querySelectorAll(".vp-skin"),{attr:{fill:(i,el)=>el.dataset.f},opacity:1,duration:.8},0).to("#vp-trunk",{attr:{stroke:SK},duration:.8},0)
        .to("#vp-rider",{rotation:0,y:0,duration:.4},0).to(svg.querySelectorAll(".vp-leg"),{rotation:0,duration:.3},0)
        .to(["#vp-tb","#vp-pf","#vp-chipR"],{opacity:0,duration:.5},0).to("#vp-path",{opacity:1,duration:.6},.6).to(["#vp-reins","#vp-chipG"],{opacity:1,duration:.6},1);mood(tl,"#vp-rider","calm",.4);},
      amb:()=>[gsap.to("#vp-dash",{attr:{"stroke-dashoffset":-480},duration:4,ease:"none",repeat:-1}),gsap.to(svg.querySelectorAll(".vp-leg"),{rotation:5,transformOrigin:"50% 0%",duration:.6,yoyo:true,repeat:-1,stagger:.3,ease:"sine.inOut"})]},
    {k:"Back to the syllabus",c:"With a calm, sharp mind, you are ready for the main technique.",b:tl=>closeCard(tl,"A","#vp-A"),amb:()=>pulseSeg("V")},
    {k:"Vipassana",c:"From Day 4, attention moves from the breath to the whole body. Vipassana means seeing things as they really are.",b:tl=>openCard(tl,"V")},
    {k:"The body scan",c:"You move attention slowly from head to feet, one part at a time, noticing whatever sensation is there.",b:tl=>{
      tl.to("#vp-V",{opacity:1,duration:.6},0).to(["#vp-meter","#vp-sprP"],{opacity:1,duration:.5},.6).to(S,{spring:1,duration:.6,onUpdate:S.render},.8).to("#vp-springTag",{opacity:1,duration:.4},1);
      [0,1,2,3].forEach(i=>tl.to(`#vp-hl${i}`,{opacity:.9,duration:.15,yoyo:true,repeat:1},1.2+i*.25));
      for(let i=4;i<10;i++)tl.to(`#vp-hl${i}`,{opacity:.9,duration:.15,yoyo:true,repeat:1},1.2+i*.25);}},
    {k:"Round 1 · head",c:"Forehead, eyes, nose, ears. At each spot: feel the sensation, don't react, move on.",b:tl=>{[0,1,2,3].forEach((i,j)=>scan(tl,i,j*1.4,1.3,1));}},
    {k:"Round 1 · body",c:"Neck, chest, stomach, arms, legs. Pleasant or unpleasant, every sensation is simply observed.",b:tl=>{[4,5,6,7,8,9].forEach((i,j)=>scan(tl,i,j*1.3,1.2,1));}},
    {k:"Anicha",c:"Every sensation arises and passes away. Seeing this again and again is anicha, impermanence.",b:tl=>{
      tl.to("#vp-anicca",{opacity:1,duration:.6},0);sliderTo(tl,S,60,.5,"power3.out",.8);sliderTo(tl,S,12,2.6,"sine.inOut",1.4);
      tl.fromTo("#vp-plus",{opacity:0,y:10},{opacity:1,y:-20,duration:.6},4).to("#vp-plus",{opacity:0,duration:.4},4.8).to(S,{n:10,sw:3.5,amp:9,duration:.6,onUpdate:S.render},4);sliderTo(tl,S,0,.8,"power2.out",4.2);}},
    {k:"Round 2",c:"On the next round, most of those sensations have changed or vanished. Nothing stays the same.",b:tl=>{
      tl.to("#vp-anicca",{opacity:0,duration:.4},0).to("#vp-r2h",{opacity:1,duration:.4},.2).to(PARTS.map((_,i)=>`#vp-l1_${i}`),{opacity:.45,duration:.6},.2);PARTS.forEach((_,i)=>scan(tl,i,.5+i*.6,.55,2));}},
    {k:"The spring gets stronger",c:"Each time you see “this too will change”, equanimity grows like a muscle. The spring gets stronger.",b:tl=>{
      [0,1,2].forEach(j=>{tl.fromTo("#vp-plus",{opacity:0,y:10},{opacity:1,y:-20,duration:.5},j*1.1).to("#vp-plus",{opacity:0,duration:.3},j*1.1+.6)
        .to(S,{n:10+(j+1)*2,sw:3.5+(j+1)*1.6,amp:9+(j+1)*1.4,duration:.5,onUpdate:S.render},j*1.1);});
      tl.call(()=>{springTxt.textContent="equanimity spring: stronger";},null,3.2);}},
    {k:"The test",c:"Now a strong sensation arises. The slider jumps, but the spring pulls it straight back to zero, and the mind stays calm.",b:tl=>{
      tl.fromTo("#vp-bigburst",{opacity:0,scale:.4,svgOrigin:"0 -46"},{opacity:1,scale:1,duration:.35,ease:"back.out(3)"},0);sliderTo(tl,S,85,.35,"power4.out",.05);
      sliderTo(tl,S,0,1.6,"elastic.out(1,0.35)",.45);tl.to("#vp-bigburst",{opacity:.3,duration:.6},1.4).to("#vp-bal",{opacity:1,duration:.5},1.6);}},
    {k:"Back to the syllabus",c:"The ten days end with one more practice: sharing the peace you have built.",b:tl=>closeCard(tl,"V","#vp-V"),amb:()=>pulseSeg("M")},
    {k:"Metta",c:"On the last day you learn Metta: sharing goodwill with all beings.",b:tl=>openCard(tl,"M")},
    {k:"Sabka bhala ho",c:"Silently, the meditator wishes: may all beings be happy, may all beings be well.",b:tl=>{
      tl.to("#vp-M",{opacity:1,duration:.6},0).to("#vp-mglow",{opacity:1,duration:.8},.4).fromTo("#vp-bub",{opacity:0,scale:.8,transformOrigin:"20% 80%"},{opacity:1,scale:1,duration:.6,ease:"back.out(1.8)"},1);},
      amb:()=>[gsap.to("#vp-mglow",{attr:{r:160},duration:2.5,yoyo:true,repeat:-1,ease:"sine.inOut"})]},
    {k:"Spreading out",c:"The wish spreads outward: to family, to friends, to neighbours, and to the whole world.",b:tl=>{
      [0,1,2,3].forEach(i=>tl.fromTo(`#vp-ring${i}`,{opacity:0,scale:.6,svgOrigin:`${MC[0]} ${MC[1]}`},{opacity:1,scale:1,duration:.9,ease:"power2.out"},i*.8));},
      amb:()=>[gsap.to("#vp-mglow",{attr:{r:160},duration:2.5,yoyo:true,repeat:-1,ease:"sine.inOut"}),gsap.set("#vp-emit",{opacity:1}),
        ...gsap.utils.toArray("#svg-vp .vp-em").map((c,i)=>gsap.fromTo(c,{attr:{r:120},opacity:.8},{attr:{r:520},opacity:0,duration:4,ease:"power1.out",repeat:-1,delay:i*1.33}))]},
    {k:"The whole path",c:"Anapana sharpens the mind, Vipassana builds equanimity, Metta shares it. That is the 10-day course.",b:tl=>{closeCard(tl,"M","#vp-M");tl.to("#vp-sum",{opacity:1,duration:.6},2);}}
  ];
  return {svg,steps,init};
})();

/* ================= navigation ================= */
const decks={e1:E1,e2:E2,vp:V,hi:H,gu:G,tt:T,fe:F};let D=null,cur=-1,tl=null,amb=[];
const dots=document.getElementById("dots");
const killAmb=()=>{amb.forEach(a=>a.kill());amb=[];};
const build=i=>{const t=gsap.timeline({paused:true});D.steps[i].b(t);return t;};
function stopTl(){if(tl){tl.eventCallback("onComplete",null);tl.progress(1);tl.kill();tl=null;}}
function go(n){
  if(n<0||n>=D.steps.length)return;
  killAmb();stopTl();
  if(n!==cur+1){D.init();for(let i=1;i<n;i++){const t=build(i);t.progress(1);t.kill();}}
  cur=n;ui();
  const startAmb=()=>{killAmb();if(D.steps[n].amb)amb=D.steps[n].amb();};
  if(n===0){startAmb();return;}
  tl=build(n);tl.eventCallback("onComplete",startAmb);tl.play();
}
function ui(){const s=D.steps[cur];document.getElementById("kick").textContent=s.k;document.getElementById("num").textContent=`${cur+1} / ${D.steps.length}`;
  document.getElementById("capText").textContent=s.c;[...dots.children].forEach((d,i)=>{d.classList.toggle("on",i===cur);d.classList.toggle("done",i<cur);});
  document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===D.steps.length-1;}
function useDeck(key){
  killAmb();stopTl();
  Object.values(decks).forEach(d=>d.svg.setAttribute("hidden",""));D=decks[key];D.svg.removeAttribute("hidden");const st=document.getElementById("stage");st.classList.toggle("scroll",key==="tt");st.scrollTop=0;
  document.querySelectorAll(".sub").forEach(b=>b.setAttribute("aria-selected",b.dataset.deck===key));
  dots.innerHTML="";D.steps.forEach((s,i)=>{const d=document.createElement("button");d.className="dot";d.setAttribute("aria-label",`Step ${i+1}: ${s.k}`);
    d.addEventListener("click",e=>{e.stopPropagation();go(i);});dots.appendChild(d);});
  D.init();cur=-1;go(0);
}
let conceptDeck="e1";const subBar=document.querySelector(".subtabs");
document.querySelectorAll(".sub").forEach(b=>b.addEventListener("click",()=>{conceptDeck=b.dataset.deck;useDeck(conceptDeck);}));
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{const t=b.dataset.tab;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===b)));
  subBar.style.visibility=t==="concept"?"visible":"hidden";useDeck(t==="concept"?conceptDeck:t);}));
document.getElementById("next").addEventListener("click",()=>go(cur+1));
document.getElementById("prev").addEventListener("click",()=>go(cur-1));
document.getElementById("stage").addEventListener("click",()=>go(cur+1));
const fsToggle=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});}catch(_){}};
document.getElementById("fs").addEventListener("click",fsToggle);
document.addEventListener("keydown",e=>{if(e.key==="f"||e.key==="F"){fsToggle();return;}
  if(["ArrowDown","PageDown"," ","ArrowRight","Enter"].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(["ArrowUp","PageUp","ArrowLeft","Backspace"].includes(e.key)){e.preventDefault();go(cur-1);}
});
if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)gsap.globalTimeline.timeScale(2.5);
[E2,V,H,G,T,F].forEach(d=>d.init());window.__go=n=>go(n);useDeck("e1");
})();
</script>
